<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casebridge — Personal injury referrals, matched in minutes.</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pricing.css?v=2">
  <style>
    @keyframes slideIn {
      0% { opacity: 0; transform: translateY(-12px) scale(0.96); }
      60% { opacity: 1; }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="heart.jsx"></script>
  <script type="text/babel" src="how-it-works.jsx"></script>
  <script type="text/babel" src="audiences.jsx"></script>
  <script type="text/babel" src="pricing.jsx"></script>
  <script type="text/babel" src="footer.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "headline": "match",
      "ctaText": "Join the clinic network",
      "accent": "#3D5AFE",
      "showFloats": true,
      "background": "lavender"
    }/*EDITMODE-END*/;

    function App() {
      const [values, set] = useTweaks(TWEAK_DEFAULTS);

      // apply background tweak
      useEffect(() => {
        const map = {
          lavender: "#ECEAF3",
          warm: "#F2EFE8",
          mint: "#E6F0EC",
          slate: "#E8EAEF"
        };
        document.body.style.background = map[values.background] || map.lavender;
        document.documentElement.style.setProperty('--accent', values.accent);
      }, [values.background, values.accent]);

      // toggle floats
      useEffect(() => {
        document.querySelectorAll('.float').forEach(el => {
          el.style.display = values.showFloats ? '' : 'none';
        });
      }, [values.showFloats]);

      return (
        <div className="page">
          <Nav />
          <section className="hero">
            <HeroLeft tweaks={values} />
            <HeartStage tweaks={values} />
          </section>

          <HowItWorks />
          <Audiences />
          <Pricing />
          <Footer />

          <TweaksPanel title="Tweaks">
            <TweakSection title="Copy">
              <TweakRadio
                label="Headline"
                value={values.headline}
                options={[
                  { value: "match", label: "Matched in minutes" },
                  { value: "network", label: "The network" },
                  { value: "growth", label: "Grow your clinic" }
                ]}
                onChange={v => set('headline', v)}
              />
              <TweakText
                label="Primary CTA"
                value={values.ctaText}
                onChange={v => set('ctaText', v)}
              />
            </TweakSection>
            <TweakSection title="Visuals">
              <TweakRadio
                label="Background"
                value={values.background}
                options={[
                  { value: "lavender", label: "Lavender" },
                  { value: "warm", label: "Warm" },
                  { value: "mint", label: "Mint" },
                  { value: "slate", label: "Slate" }
                ]}
                onChange={v => set('background', v)}
              />
              <TweakColor
                label="Accent color"
                value={values.accent}
                onChange={v => set('accent', v)}
              />
              <TweakToggle
                label="Floating cards"
                value={values.showFloats}
                onChange={v => set('showFloats', v)}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
